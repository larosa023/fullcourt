# Publishes the website to GitHub Pages: https://larosa023.github.io/fullcourt/
# A second copy of the site next to Netlify (and Cloudflare Pages), to compare hosts. Same files, same data.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**', 'tools/**', 'netlify/**', 'bot/**', 'functions/**', '.github/workflows/discord.yml', 'README.md', 'netlify.toml', '.github/workflows/desktop.yml', '.github/workflows/odds.yml']
  schedule:
    - cron: '17 10 * * *' # daily, so the weekly awards update (pushed by a bot, which doesn't trigger this) shows up
  workflow_dispatch:
    inputs:
      runner: { description: 'Machine type (the watchdog picks another one when the usual type is stuck)', type: choice, options: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04], default: ubuntu-latest }
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: '${{ steps.deploy.outputs.page_url }}'
    steps:
      - uses: actions/checkout@v4
      - name: Gather the site
        run: |
          mkdir _site
          cp -r index.html assets fonts data ocr sw.js manifest.webmanifest ./*.png _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      # GitHub sometimes takes a little while to list a freshly uploaded artifact (after its Nov 25 outage the deploy
      # step kept finding none): wait until it shows up, up to two minutes
      - name: Wait for the upload to be listed
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            [ "$n" -gt 0 ] && { echo "listed after $((i * 5 - 5)) s"; exit 0; }
            sleep 5
          done
          echo "not listed after 2 minutes; trying the deploy anyway"
      - id: deploy
        uses: actions/deploy-pages@v4
