# Mock Draft: draft order, team needs and the prospect board for the NBA and WNBA (ESPN), daily.
# Publishes draft.json to the draft-data branch (not part of the website, so no deploy).
name: draft
on:
  push:
    branches: [main]
    paths: ['tools/draft.mjs', '.github/workflows/draft.yml']
  schedule:
    - cron: '23 11 * * *' # every day, 6:23 AM ET
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: draft, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: mkdir pub && node tools/draft.mjs pub/draft.json
      - name: Publish
        run: |
          cd pub && git init -q && git checkout -q --orphan draft-data
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add draft.json && git commit -qm "draft $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" draft-data
