name: probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (compatible; fullcourt-history/1.0; weekly; +https://github.com/larosa023/fullcourt)'
          for u in /wnba/leaders/pts_career.html /wnba/playoffs/ /wnba/awards/mvp.html /wnba/players/t/tauradi01w.html /wnba/leaders/; do
            echo "=== $u"; curl -s -A "$UA" -w '\nHTTP %{http_code}\n' "https://www.basketball-reference.com$u" -o p.html; sed 's/<!--//g;s/-->//g' p.html > q.html
            grep -o 'id="[a-z_0-9]*"' q.html | grep -v 'id="meta\|id="header' | sort -u | head -40 | tr '\n' ' '; echo
            grep -o '<tr[^>]*>.\{0,700\}' q.html | grep 'data-stat' | head -4
            grep -o 'id="info".\{0,1500\}' q.html | head -c 1500; echo
            sleep 5
          done
