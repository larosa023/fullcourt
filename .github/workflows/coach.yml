# Coaches: head coaches and front offices from Basketball-Reference (tools/coach.mjs), weekly.
# Publishes coaches.json to the coach-data branch (not part of the website, so no deploy).
name: coach
on:
  push:
    branches: [main]
    paths: ['tools/coach.mjs', '.github/workflows/coach.yml']
  schedule:
    - cron: '17 9 * * 3' # Wednesdays, 4:17 AM ET
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: coach, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: mkdir pub && node tools/coach.mjs pub/coaches.json
      - name: Publish
        run: |
          cd pub && git init -q && git checkout -q --orphan coach-data
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add coaches.json && git commit -qm "coaches $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" coach-data
