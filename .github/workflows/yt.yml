# Full game highlights for Replay: reads the NBA YouTube channel's public feed every 30 minutes and publishes
# highlights.json to the yt-data branch (not part of the website, so no deploy).
name: highlights
on:
  push:
    branches: [main]
    paths: ['tools/yt.mjs', '.github/workflows/yt.yml']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      runner: { description: 'Machine type (the watchdog picks another one when the usual type is stuck)', type: choice, options: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04], default: ubuntu-latest }
permissions:
  contents: write
concurrency: { group: highlights, cancel-in-progress: false }
jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build highlights.json
        env: { YT_KEY: '${{ secrets.YT_KEY }}' }
        run: mkdir pub && node tools/yt.mjs pub/highlights.json
      - name: Publish
        run: |
          cd pub && git init -q && git checkout -q --orphan yt-data
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add highlights.json && git commit -qm "highlights $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" yt-data
