name: eraprobe
on:
  push:
    branches: [era-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Take the push sender from main
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/netlify/push/webpush.mjs -o tools/webpush.mjs
      - run: node tools/eraprobe.mjs
      - name: Publish
        if: always()
        run: |
          cd probe && git init -q && git checkout -q --orphan era-probe-out
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" era-probe-out
