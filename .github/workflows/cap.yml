# Contracts for Capsheet and Deadline: ESPN rosters + Basketball-Reference contract pages, once a week.
# Publishes contracts.json to the cap-data branch (not part of the website, so no deploy).
name: cap
on:
  push:
    branches: [main]
    paths: ['tools/cap*.mjs', '.github/workflows/cap.yml']
  schedule:
    - cron: '23 9 * * 1' # Mondays, 4:23 AM ET
  workflow_dispatch:
    inputs:
      runner: { description: 'Machine type (the watchdog picks another one when the usual type is stuck)', type: choice, options: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04], default: ubuntu-latest }
permissions:
  contents: write
concurrency: { group: cap, cancel-in-progress: false }
jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build contracts.json
        run: |
          mkdir pub
          node tools/cap.mjs pub/contracts.json
      - name: Publish
        run: |
          cd pub && git init -q && git checkout -q --orphan cap-data
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add contracts.json && git commit -qm "cap $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" cap-data
