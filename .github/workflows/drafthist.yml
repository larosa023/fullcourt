# Draft history: every NBA draft class since 2001 with careers and honours (tools/drafthist.mjs), daily.
# Publishes draft-history.json to the draft-data branch (not part of the website, so no deploy).
name: drafthist
on:
  push:
    branches: [main, draft-job]
    paths: ['tools/drafthist.mjs', '.github/workflows/drafthist.yml']
  schedule:
    - cron: '17 9 * * *' # every day, 4:17 AM ET
  workflow_dispatch:
    inputs:
      runner: { description: 'Machine type (the watchdog picks another one when the usual type is stuck)', type: choice, options: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04], default: ubuntu-latest }
permissions:
  contents: write
concurrency: { group: drafthist, cancel-in-progress: false }
jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: mkdir pub && node tools/drafthist.mjs pub/draft-history.json
      - name: Publish
        run: |
          cd pub && git init -q && git checkout -q --orphan draft-data
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add draft-history.json && git commit -qm "draft history $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" nick-data
