# Builds the Windows app (desktop/).
# Releases: change desktop/VERSION on main (e.g. 1.0.1). GitHub builds it and publishes desktop-v1.0.1 on the Releases page.
# Test builds: push to the desktop branch or run it by hand; the installer is attached to the run.
name: desktop
on:
  push:
    branches: [main, desktop]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: 'desktop-${{ github.ref }}', cancel-in-progress: true }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }
      - name: Pack the site
        shell: bash
        run: |
          mkdir -p desktop/dist
          cp -r index.html assets fonts data ocr manifest.webmanifest favicon-32.png apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png desktop/dist/
          cp index.html desktop/dist/mini.html  # the mini scoreboard window: same page, compact layout
      - name: Set the version
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          REL=0
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then V="${GITHUB_REF_NAME#desktop-v}"; REL=1
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then V="$(tr -d ' \r\n' < desktop/VERSION)"; gh release view "desktop-v$V" >/dev/null 2>&1 || REL=1
          else V="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "V=$V" >> "$GITHUB_ENV"; echo "REL=$REL" >> "$GITHUB_ENV"; echo "version $V, release $REL"
          V="$V" node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));j.version=process.env.V;fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx tauri icon ../icon-512.png
          npx tauri build
          cp src-tauri/target/release/bundle/nsis/*.exe ../Fullcourt-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: 'Fullcourt-Setup-${{ env.V }}', path: Fullcourt-Setup.exe }
      - name: Publish the release
        if: env.REL == '1'
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "desktop-v$V" Fullcourt-Setup.exe --target "$GITHUB_SHA" --title "Fullcourt for Windows $V" --notes "Download **Fullcourt-Setup.exe** below and run it. Windows may say it protected your PC the first time (the app isn't code-signed): click **More info**, then **Run anyway**. Installing a newer version over an older one keeps your bets and settings."
