name: odds-probe
on: { push: { branches: [odds-probe] } }
permissions: { contents: write }
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { SGO_KEY: "${{ secrets.SGO_KEY }}", HOURS: "30" }
        run: |
          node tools/odds.mjs odds.json
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add odds.json; git commit -m "odds [skip ci]"; git push
