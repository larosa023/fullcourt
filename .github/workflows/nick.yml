# Nicknames: real player nicknames from Basketball-Reference player pages (tools/nick.mjs), daily, incremental.
# Publishes nicknames.json to the nick-data branch (not part of the website, so no deploy).
name: nick
on:
  push:
    branches: [main]
    paths: ['tools/nick.mjs', '.github/workflows/nick.yml']
  schedule:
    - cron: '41 8 * * *' # every day, 3:41 AM ET
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: nick, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build
        run: mkdir pub && node tools/nick.mjs pub/nicknames.json
      - name: Publish
        run: |
          cd pub && git init -q && git checkout -q --orphan nick-data
          git config user.name fullcourt-bot && git config user.email bot@users.noreply.github.com
          git add nicknames.json && git commit -qm "nicknames $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" nick-data
