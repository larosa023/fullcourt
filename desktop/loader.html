<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fullcourt</title>
<style>html,body{margin:0;height:100%;background:#0D0F12}@media (prefers-color-scheme:light){html,body{background:#F4EFE6}}
.fc-wait{position:fixed;inset:0;display:grid;place-items:center;opacity:0;animation:fcin .3s ease .5s forwards}
.fc-wait i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,107,44,.25);border-top-color:#FF6B2C;animation:fcspin .8s linear infinite}
@keyframes fcspin{to{transform:rotate(360deg)}}@keyframes fcin{to{opacity:1}}</style>
<script>
/* The Windows app's front door. It loads the newest Fullcourt from GitHub Pages, so site changes reach the app the moment
   they're published, with no app update. The page keeps this app's own address, so your saved settings, picks, bets and
   mock drafts stay put. Offline, or if GitHub Pages is slow (3 s), it opens the copy built into the app (app.html).
   The mini scoreboard (mini.html) opens through this same page, so it's always current too. */
(async () => {
  const REMOTE = 'https://larosa023.github.io/fullcourt/';
  let html = null, base = '';
  const local = /[?&]local\b/.test(location.search) || sessionStorage.getItem('fc-local') === '1';
  if (!local && navigator.onLine !== false) {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch(REMOTE + 'index.html?t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (r.ok) { const h = await r.text(); if (/"core":"\.\/assets\//.test(h)) { html = h; base = REMOTE; } }
    } catch (e) {}
  }
  if (!html) html = await (await fetch('app.html')).text();
  if (base) html = html.replace(/(["'(])\.\/(assets|fonts|data|ocr)\//g, `$1${base}$2/`);
  /* Put the stylesheet straight into the page. A page written in this way can paint before a linked stylesheet arrives,
     which flashed unstyled buttons for a moment (most visible in the mini scoreboard). */
  try {
    const m = html.match(/<link rel="stylesheet" href="([^"]+)">/);
    if (m) {
      const cssURL = new URL(m[1], base || location.href).href;
      const r = await fetch(cssURL);
      if (r.ok) {
        const css = (await r.text()).replace(/url\((['"]?)([^'")]+)\1\)/g, (s, q, u) => /^(data:|https?:|#)/.test(u) ? s : `url(${q}${new URL(u, cssURL).href}${q})`);
        html = html.replace(m[0], () => `<style>${css.replace(/<\/style/gi, '<\\/style')}</style>`);
      }
    }
  } catch (e) {}
  html = html.replace(/<head>/i, `<head><script>window.FC_BASE=${JSON.stringify(base || location.href.replace(/[^/]*([?#].*)?$/, ''))};window.FC_LIVE=${base ? 'true' : 'false'}<\/script>`);
  document.open(); document.write(html); document.close();
})();
</script>
</head>
<body><div class="fc-wait" aria-label="Loading"><i></i></div></body>
</html>
