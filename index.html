:root[data-theme="dark"] {
  --bg: #0C0E11; --surface: #14171C; --surface-2: #1A1E24; --surface-3: #232831;
  --ink: #EDEFF2; --ink-2: #C9CED6; --muted: #8B93A0; --line: #252A32;
  --accent: #FF7A3D; --accent-ink: #160A04; --live: #FF4170; --win: #3DD488; --loss: #FF6A5C;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 28px -14px rgb(0 0 0 / .7);
  --scrim: rgb(0 0 0 / .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- masthead ---------- */
.mast {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in oklab, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line);
}
.mast-in {
  max-width: 1320px; margin: 0 auto; height: 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand svg { width: 26px; height: 26px; }
.brand b {
  font-family: var(--display); font-stretch: 68%; font-weight: 900; font-size: 25px;
  letter-spacing: .01em; text-transform: uppercase; line-height: 1;
}
.brand b i { font-style: normal; color: var(--accent); }
.nav { display: flex; gap: 2px; margin-left: 8px; position: relative; }
.nav button {
  position: relative; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted);
  transition: color .2s;
}
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); }
.nav .pill {
  position: absolute; top: 0; height: 100%; border-radius: 999px; background: var(--surface);
  box-shadow: var(--shadow); transition: transform .45s var(--ease), width .45s var(--ease); z-index: -1;
}
.mast-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pulse-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap;
}
.pulse-chip strong { color: var(--ink); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--live); box-shadow: 0 0 0 0 color-mix(in oklab, var(--live) 60%, transparent); animation: ping 1.6s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--live) 55%, transparent); } 80%, 100% { box-shadow: 0 0 0 7px transparent; } }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line); transition: transform .2s var(--ease), background .2s;
  flex: none;
}
.icon-btn:hover { transform: translateY(-1px); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 18px; height: 18px; }
.theme-btn .sun { display: none; }
:root[data-theme="dark"] .theme-btn .sun { display: block; }
:root[data-theme="dark"] .theme-btn .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-btn .sun { display: block; }
  :root:not([data-theme="light"]) .theme-btn .moon { display: none; }
}

/* bottom nav (phones) */
.tabbar { display: none; }

/* ---------- page ---------- */
main {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.view { display: none; }
.view.on { display: block; animation: viewIn .45s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; flex-wrap: wrap; }
.sec-h h2, .h-display {
  margin: 0; font-family: var(--display); font-stretch: 72%; font-weight: 800; text-transform: uppercase;
  letter-spacing: .01em; line-height: 1; text-wrap: balance;
}
.sec-h h2 { font-size: 22px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.page-title { font-size: clamp(34px, 6vw, 64px); margin: 4px 0 18px; }

/* drag scroll */
.hs { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.hs::-webkit-scrollbar { display: none; }
.hs.dragging { cursor: grabbing; scroll-snap-type: none !important; }
.hs.dragging * { pointer-events: none; user-select: none; }
.hs-wrap { position: relative; }
.hs-wrap::before, .hs-wrap::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; z-index: 2; transition: opacity .2s;
}
.hs-wrap::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); opacity: var(--fl, 0); }
.hs-wrap::after { right: 0; background: linear-gradient(-90deg, var(--bg), transparent); opacity: var(--fr, 1); }
.hs-wrap.on-surface::before { background: linear-gradient(90deg, var(--surface), transparent); }
.hs-wrap.on-surface::after { background: linear-gradient(-90deg, var(--surface), transparent); }
.drag-x { cursor: grab; }

/* date rail */
.rail-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.rail-row .hs-wrap { flex: 1; min-width: 0; }
.rail { padding: 4px 2px; scroll-snap-type: x proximity; }
.day {
  flex: none; width: 62px; padding: 8px 0 9px; border-radius: 14px; text-align: center; scroll-snap-align: center;
  background: transparent; border: 1px solid transparent; transition: background .2s, border-color .2s, transform .2s var(--ease);
}
.day:hover { background: var(--surface); }
.day .dw { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.day .dn { display: block; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 24px; line-height: 1.1; }
.day .dm { display: block; font-size: 10.5px; color: var(--muted); }
.day.today .dw { color: var(--accent); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); transform: translateY(-1px); }
.day[aria-pressed="true"] .dw, .day[aria-pressed="true"] .dm { color: color-mix(in oklab, var(--bg) 70%, transparent); }
.rail-btn { display: grid; }

/* scores layout */
.scores-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.day-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.day-head h1 { font-size: clamp(30px, 4.6vw, 48px); margin: 0; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.count {
  font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--surface);
  border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2);
}
.filter-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.game {
  position: relative; display: grid; gap: 12px; text-align: left; padding: 14px 16px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; overflow: hidden; min-width: 0;
}
.game:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.game.live { border-color: color-mix(in oklab, var(--live) 40%, var(--line)); }
.g-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
.g-top .tv { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status.live { color: var(--live); }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.lg { width: 34px; height: 34px; object-fit: contain; flex: none; }
.tname { min-width: 0; }
.tname b { display: block; font-weight: 650; font-size: 15.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tname span { font-size: 12px; color: var(--muted); }
.score {
  font-family: var(--display); font-stretch: 72%; font-weight: 800; font-size: 32px; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: .005em; display: inline-block;
}
.trow.lose .score, .trow.lose .tname b { color: var(--muted); font-weight: 600; }
.trow.win .score::after { content: ""; display: inline-block; width: 0; height: 0; margin-left: 6px; vertical-align: middle;
  border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 6px solid var(--ink); }
.score.bump { animation: bump 1.2s var(--ease); }
@keyframes bump { 0% { color: var(--accent); transform: scale(1.25); } 60% { color: var(--accent); } 100% { transform: none; } }
.g-foot { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; min-width: 0; }
.g-foot .lead { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-foot .lead b { color: var(--ink); font-weight: 600; }
.mini-face { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--surface-3); flex: none; }
.prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--live); border-radius: 0 3px 3px 0; transition: width 1s var(--ease); }
.tip { font-family: var(--display); font-stretch: 75%; font-weight: 700; font-size: 20px; color: var(--ink); }

.enter { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 35ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.985); } }

/* performers */
.perf-block { margin: 26px 0 0; }
.perf { padding: 2px 2px 6px; scroll-snap-type: x proximity; }
.pcard {
  flex: none; width: 168px; scroll-snap-align: start; border-radius: var(--r); overflow: hidden; text-align: left;
  background: var(--surface); border: 1px solid var(--line); position: relative; transition: transform .25s var(--ease), box-shadow .25s;
}
.pcard:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.pcard .ph { position: relative; aspect-ratio: 350 / 254; background: linear-gradient(160deg, var(--tc, var(--surface-3)), color-mix(in oklab, var(--tc, var(--surface-3)) 30%, var(--surface-2))); max-width: 100%; }
.pcard .ph img.face { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.pcard .ph .lg { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; }
.pcard .pv { position: absolute; right: 8px; bottom: 6px; font-family: var(--display); font-stretch: 70%; font-weight: 900; font-size: 34px; line-height: 1; color: #fff; text-shadow: 0 2px 12px rgb(0 0 0 / .45); }
.pcard .pv small { font-size: 12px; font-family: var(--mono); font-weight: 500; margin-left: 3px; letter-spacing: .04em; }
.pcard .pi { padding: 9px 11px 11px; }
.pcard .pi b { display: block; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .pi span { font-size: 12px; color: var(--muted); }

/* sidebar */
.side { display: grid; gap: 16px; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.panel h3 { margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
.panel h3 span { font-family: var(--display); font-stretch: 72%; font-weight: 800; text-transform: uppercase; font-size: 17px; }
.link-btn { font-size: 12.5px; font-weight: 600; color: var(--accent); }
.link-btn:hover { text-decoration: underline; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface-3); position: relative; }
.seg button { position: relative; z-index: 1; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); transition: color .2s; white-space: nowrap; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .knob { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); transition: transform .4s var(--ease), width .4s var(--ease); }
.mini-row { display: grid; grid-template-columns: 20px 24px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 4px; border-radius: 10px; width: 100%; text-align: left; font-size: 13.5px; }
.mini-row:hover { background: var(--surface-2); }
.mini-row .lg { width: 24px; height: 24px; }
.mini-row .sd { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.mini-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.mini-row .rc { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.mini-row .gb { font-variant-numeric: tabular-nums; color: var(--muted); width: 32px; text-align: right; font-size: 12px; }
.cutline { height: 1px; margin: 4px 0; background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }

/* empty / error / skeleton */
.empty { padding: 40px 20px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--display); font-stretch: 75%; font-size: 22px; text-transform: uppercase; margin-bottom: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13.5px; margin-top: 12px; }
.sk { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: var(--r); }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- standings ---------- */
.std-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.std-head .page-title { margin: 0; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.std { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 860px; font-size: 14px; }
.std th { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 12px 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
.std th:first-child, .std td:first-child { text-align: left; position: sticky; left: 0; z-index: 2; background: var(--surface); }
.std td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.std tbody tr { cursor: pointer; transition: background .15s; }
.std tbody tr:hover td { background: var(--surface-2); }
.std tr:last-child td { border-bottom: 0; }
.std .team-cell { display: flex; align-items: center; gap: 12px; min-width: 210px; }
.std .seed { width: 22px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.std .team-cell b { font-weight: 650; }
.std .team-cell .ab { display: none; font-weight: 700; }
.std tr.cut td { border-bottom: 2px solid var(--ink); }
.std tr.cut-pi td { border-bottom: 2px dashed var(--muted); }
.zone { display: inline-block; width: 4px; height: 22px; border-radius: 2px; background: transparent; }
.zone.po { background: var(--win); }
.zone.pi { background: var(--accent); }
.strk-w { color: var(--win); font-weight: 600; }
.strk-l { color: var(--loss); font-weight: 600; }
.diffbar { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.diffbar i { display: block; height: 6px; border-radius: 3px; width: 0; transition: width .9s var(--ease); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .zone { height: 12px; }

/* ---------- teams ---------- */
.conf-h { margin: 28px 0 12px; display: flex; align-items: baseline; gap: 12px; }
.conf-h h2 { font-size: 26px; }
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.ttile {
  position: relative; overflow: hidden; text-align: left; padding: 16px; border-radius: var(--r); min-height: 132px;
  background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
  transition: transform .3s var(--ease), box-shadow .3s;
}
.ttile::before { content: ""; position: absolute; inset: auto 0 0 0; height: 4px; background: var(--tc, var(--ink)); transform-origin: left; transition: height .35s var(--ease); }
.ttile:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.ttile:hover::before { height: 7px; }
.ttile .bg-logo { position: absolute; right: -18px; top: -14px; width: 120px; height: 120px; opacity: .1; transition: transform .5s var(--ease), opacity .3s; }
.ttile:hover .bg-logo { transform: rotate(-8deg) scale(1.08); opacity: .18; }
.ttile .lg { width: 44px; height: 44px; position: relative; }
.ttile b { display: block; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 21px; line-height: 1.05; text-transform: uppercase; position: relative; }
.ttile span { font-size: 12.5px; color: var(--muted); position: relative; }

/* ---------- leaders ---------- */
.chips { padding: 2px; margin-bottom: 18px; }
.chip { flex: none; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .2s, color .2s, transform .2s var(--ease); }
.chip:hover { transform: translateY(-1px); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lead-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.hero-card {
  position: relative; overflow: hidden; border-radius: 20px; text-align: left; width: 100%; color: #fff;
  background: linear-gradient(165deg, var(--tc, #333) 0%, color-mix(in oklab, var(--tc, #333) 55%, #000) 100%);
  min-height: 420px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
  transition: transform .35s var(--ease);
}
.hero-card:hover { transform: translateY(-3px); }
.hero-card .face { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 112%; max-width: none; height: auto; aspect-ratio: 350/254; object-fit: cover; object-position: top; }
.hero-card::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, rgb(0 0 0 / .78)); }
.hero-card > * { position: relative; z-index: 1; }
.hero-card .face { z-index: 0; }
.hero-card .rk { position: absolute; top: 16px; left: 18px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; opacity: .85; z-index: 2; }
.hero-card .big { font-family: var(--display); font-stretch: 65%; font-weight: 900; font-size: 92px; line-height: .85; }
.hero-card .big small { font-size: 18px; font-family: var(--mono); font-weight: 500; margin-left: 6px; letter-spacing: .05em; }
.hero-card .who { font-size: 20px; font-weight: 700; margin-top: 8px; }
.hero-card .meta { font-size: 13px; opacity: .8; }
.lrows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.lrow { display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) 1.2fr 64px; gap: 12px; align-items: center; padding: 8px 10px; width: 100%; text-align: left; border-radius: 10px; }
.lrow:hover { background: var(--surface-2); }
.lrow .rk { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lrow .face { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--surface-3); }
.lrow .nm { min-width: 0; }
.lrow .nm b { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .nm span { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.lrow .nm .lg { width: 16px; height: 16px; }
.lrow .bar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.lrow .bar i { display: block; height: 100%; width: 0; background: var(--ink-2); border-radius: 4px; transition: width .9s var(--ease); }
.lrow:first-child .bar i { background: var(--accent); }
.lrow .v { text-align: right; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }

/* ---------- flyouts ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 80; backdrop-filter: blur(2px); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 90; top: 0; right: 0; bottom: 0; width: min(640px, 100vw);
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: -24px 0 60px -30px rgb(0 0 0 / .5);
  display: flex; flex-direction: column; transform: translateX(104%); transition: transform .5s var(--ease), filter .4s, opacity .4s;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.sheet.open { transform: none; }
.sheet.behind { transform: translateX(-28px) scale(.985); filter: brightness(.85); }
.sheet-grip { display: none; }
.sheet-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
.sheet-title { font-family: var(--display); font-stretch: 72%; font-weight: 800; text-transform: uppercase; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; flex: 1; padding: 18px 18px 40px; }
.sheet-body > * + * { margin-top: 18px; }

/* game sheet */
.gh { border-radius: 18px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); position: relative; }
.gh-band { position: absolute; inset: 0 0 auto; height: 5px; display: flex; }
.gh-band i { flex: 1; }
.gh-main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 26px 16px 18px; }
.gh-team { display: grid; justify-items: center; gap: 6px; text-align: center; width: 100%; min-width: 0; }
.gh-team .lg { width: 58px; height: 58px; transition: transform .3s var(--ease); }
.gh-team:hover .lg { transform: scale(1.08) rotate(-4deg); }
.gh-team b { font-size: 14px; font-weight: 650; }
.gh-team span { font-size: 12px; color: var(--muted); }
.gh-score { display: flex; align-items: center; gap: 12px; }
.gh-score .score { font-size: 56px; }
.gh-score .sep { width: 10px; height: 2px; background: var(--line); }
.gh-status { text-align: center; padding: 0 16px 16px; display: grid; gap: 2px; justify-items: center; }
.gh-status .status { font-size: 13px; }
.gh-status span { font-size: 12px; color: var(--muted); }
.ls-wrap { overflow-x: auto; }
table.ls { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ls th { font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--muted); padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--line); }
.ls td { padding: 9px 10px; text-align: center; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); }
.ls tr:last-child td { border-bottom: 0; }
.ls th:first-child, .ls td:first-child { text-align: left; }
.ls td:last-child { font-weight: 800; font-family: var(--display); font-stretch: 75%; font-size: 17px; }
.ls .tcell { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.ls .tcell .lg { width: 20px; height: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-h h4 { margin: 0; font-family: var(--display); font-stretch: 72%; font-weight: 800; text-transform: uppercase; font-size: 16px; letter-spacing: .01em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { padding: 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); position: relative; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tabs.hs { gap: 2px; }
.pane.anim { animation: viewIn .35s var(--ease); }

.wp svg { width: 100%; height: auto; display: block; }
.wp-lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

.box-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table.box { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; font-size: 13px; }
.box th { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .05em; color: var(--muted); padding: 8px 7px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.box td { padding: 7px 7px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.box th:first-child, .box td:first-child { position: sticky; left: 0; text-align: left; z-index: 1; }
.box td:first-child { box-shadow: 1px 0 0 var(--line); }
.box tr.sub td { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 14px; text-align: left; }
.box tr.dnp td { color: var(--muted); }
.box tr.tot td { font-weight: 700; border-bottom: 0; }
.box .pl { display: flex; align-items: center; gap: 8px; text-align: left; min-width: 150px; }
.box .pl img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--surface-3); }
.box .pl b { font-weight: 600; }
.box .pl span { color: var(--muted); font-size: 11px; margin-left: 4px; }
.box .pts { font-weight: 700; }
.cmp { display: grid; gap: 12px; }
.cmp-row { display: grid; grid-template-columns: 58px 1fr 58px; gap: 10px; align-items: center; font-size: 13px; }
.cmp-row .l { text-align: left; font-weight: 700; font-variant-numeric: tabular-nums; }
.cmp-row .r { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.cmp-row .mid { display: grid; gap: 5px; }
.cmp-row .mid span { text-align: center; font-size: 11.5px; color: var(--muted); font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.cmp-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.cmp-bars div { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; display: flex; }
.cmp-bars div:first-child { justify-content: flex-end; }
.cmp-bars i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width .9s var(--ease); }
.plays { display: grid; }
.play { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px; align-items: start; }
.play:last-child { border-bottom: 0; }
.play .clk { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.play.scoring .txt { font-weight: 600; }
.play .sc { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.play .tdot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 1px; }
.play.new { animation: flashIn 1.4s var(--ease); }
@keyframes flashIn { from { background: color-mix(in oklab, var(--accent) 18%, transparent); } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.fact span { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.fact b { font-weight: 600; font-size: 14px; }
.inj { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.inj:last-child { border-bottom: 0; }
.badge { font-family: var(--mono); font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: color-mix(in oklab, var(--loss) 14%, transparent); color: var(--loss); letter-spacing: .03em; white-space: nowrap; }
.tleaders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tl { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px; border-radius: 12px; width: 100%; }
.tl:hover { background: var(--surface-2); }
.tl img.f { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--surface-3); flex: none; }
.tl div { min-width: 0; }
.tl b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl span { font-size: 12px; color: var(--muted); }

/* team sheet */
.th-band {
  position: relative; overflow: hidden; border-radius: 20px; padding: 22px 20px; color: #fff; min-height: 170px;
  background: linear-gradient(135deg, var(--tc, #222) 0%, color-mix(in oklab, var(--tc, #222) 50%, #000) 100%);
  display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
}
.th-band .lg.big { position: absolute; right: -24px; top: -24px; width: 190px; height: 190px; opacity: .22; }
.th-band .lg.small { width: 54px; height: 54px; margin-bottom: auto; filter: drop-shadow(0 4px 10px rgb(0 0 0 / .3)); }
.th-band h2 { font-size: 40px; margin: 0; }
.th-band p { margin: 0; font-size: 13.5px; opacity: .85; }
.statline { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.statline div { background: var(--surface); padding: 10px 12px; }
.statline span { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.statline b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.sched { padding: 2px 2px 6px; scroll-snap-type: x proximity; }
.sg { flex: none; width: 128px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; scroll-snap-align: start; display: grid; gap: 6px; transition: transform .2s var(--ease); }
.sg:hover { transform: translateY(-2px); }
.sg .d { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.sg .o { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 13.5px; }
.sg .o .lg { width: 22px; height: 22px; }
.sg .r { font-size: 13px; font-variant-numeric: tabular-nums; }
.sg .r .W { color: var(--win); font-weight: 700; }
.sg .r .L { color: var(--loss); font-weight: 700; }
.sg.next { border-color: var(--ink); }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.rp { position: relative; text-align: left; border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); transition: transform .25s var(--ease), box-shadow .25s; }
.rp:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.rp .ph { position: relative; aspect-ratio: 350/254; background: linear-gradient(170deg, color-mix(in oklab, var(--tc, #888) 35%, var(--surface-2)), var(--surface-2)); overflow: hidden; max-width: 100%; }
.rp .ph .jn { position: absolute; left: 8px; top: 2px; font-family: var(--display); font-stretch: 65%; font-weight: 900; font-size: 54px; line-height: 1; color: color-mix(in oklab, var(--tc, #888) 55%, transparent); }
.rp .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .4s var(--ease); }
.rp:hover .ph img { transform: scale(1.05); }
.rp .ph .badge { position: absolute; right: 6px; top: 6px; background: var(--surface); }
.rp .in { padding: 9px 11px 11px; }
.rp .in b { display: block; font-size: 13.5px; line-height: 1.25; }
.rp .in span { font-size: 11.5px; color: var(--muted); }
.avatar { display: grid; place-items: center; font-family: var(--display); font-stretch: 75%; font-weight: 800; color: var(--muted); background: var(--surface-3); }

/* player sheet */
.pl-hero { position: relative; overflow: hidden; border-radius: 20px; min-height: 250px; color: #fff; background: linear-gradient(160deg, var(--tc, #333), color-mix(in oklab, var(--tc, #333) 45%, #000)); display: flex; align-items: flex-end; }
.pl-hero img.face { position: absolute; right: -6%; bottom: 0; height: 100%; width: auto; max-width: none; aspect-ratio: 350/254; object-fit: cover; object-position: top; }
.pl-hero .jn { position: absolute; left: 14px; top: 4px; font-family: var(--display); font-stretch: 62%; font-weight: 900; font-size: 140px; line-height: 1; opacity: .16; }
.pl-hero .txt { position: relative; padding: 18px; max-width: 62%; }
.pl-hero h2 { margin: 0; font-size: 38px; line-height: .95; }
.pl-hero p { margin: 6px 0 0; font-size: 13px; opacity: .85; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pl-hero .lg { width: 22px; height: 22px; }
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.big3 div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.big3 span { font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; color: var(--muted); }
.big3 b { display: block; font-family: var(--display); font-stretch: 70%; font-weight: 900; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.split-tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
.split-tbl th { font-family: var(--mono); font-weight: 500; font-size: 10.5px; color: var(--muted); padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
.split-tbl td { padding: 9px 6px; text-align: right; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); }
.split-tbl th:first-child, .split-tbl td:first-child { text-align: left; }
.glog { display: grid; gap: 0; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; z-index: 120; transition: transform .45s var(--ease); max-width: calc(100vw - 32px); }
.toast.on { transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .scores-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .lead-grid { grid-template-columns: minmax(0, 1fr); }
  .hero-card { min-height: 360px; }
  .hero-card .face { width: 80%; left: auto; right: -6%; transform: none; }
}
@media (max-width: 760px) {
  body { font-size: 14.5px; }
  .nav, .pulse-chip .txt-long { display: none; }
  .mast-in { height: 54px; gap: 10px; }
  main { padding-block: 14px calc(var(--navh) + 30px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
    background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
    border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .tabbar button { display: grid; justify-items: center; gap: 3px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--muted); border-radius: 12px; transition: color .2s; }
  .tabbar button svg { width: 22px; height: 22px; transition: transform .3s var(--ease); }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .tabbar button[aria-current="page"] svg { transform: translateY(-2px); color: var(--accent); }
  .rail-btn { display: none; }
  .day { width: 54px; }
  .games { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .score { font-size: 30px; }
  .pcard { width: 148px; }
  .std .team-cell { min-width: 0; }
  .std .team-cell b { display: none; }
  .std .team-cell .ab { display: inline; }
  table.std { min-width: 640px; }
  .std th, .std td { padding: 10px 9px; }
  .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ttile { min-height: 118px; padding: 14px; }
  .ttile b { font-size: 18px; }
  .lrow { grid-template-columns: 22px 40px minmax(0, 1fr) 56px; }
  .lrow .bar { display: none; }
  .lrow .face { width: 40px; height: 40px; }
  .hero-card { min-height: 300px; }
  .hero-card .big { font-size: 72px; }

  .sheet {
    top: auto; left: 0; width: 100%; height: calc(100dvh - 40px - env(safe-area-inset-top, 0px));
    border-left: 0; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
    transform: translateY(104%); padding-top: 0; box-shadow: 0 -20px 60px -20px rgb(0 0 0 / .45);
  }
  .sheet.behind { transform: translateY(-10px) scale(.96); }
  .sheet-grip { display: grid; place-items: center; height: 22px; flex: none; touch-action: none; cursor: grab; }
  .sheet-grip span { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
  .sheet-bar { padding-top: 2px; touch-action: none; }
  .sheet-body { padding: 14px max(14px, env(safe-area-inset-left, 0px)) 40px; }
  .gh-score .score { font-size: 44px; }
  .gh-team .lg { width: 48px; height: 48px; }
  .roster { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tleaders { grid-template-columns: minmax(0, 1fr); }
  .pl-hero h2 { font-size: 30px; }
  .big3 b { font-size: 32px; }
  .th-band h2 { font-size: 32px; }
}
@media (max-width: 380px) {
  .brand b { font-size: 22px; }
  .pulse-chip { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <a class="brand" href="#scores" data-view="scores" aria-label="Fullcourt home">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="var(--accent)"/>
        <path d="M16 1.5v29M1.5 16h29" stroke="var(--accent-ink)" stroke-width="1.6" opacity=".9"/>
        <circle cx="16" cy="16" r="5.5" stroke="var(--accent-ink)" stroke-width="1.6"/>
        <path d="M1.5 9.5a10 10 0 0 1 0 13M30.5 9.5a10 10 0 0 0 0 13" stroke="var(--accent-ink)" stroke-width="1.6"/>
      </svg>
      <b>Full<i>court</i></b>
    </a>
    <nav class="nav" id="nav" aria-label="Sections">
      <span class="pill" id="navPill"></span>
      <button data-view="scores">Scores</button>
      <button data-view="standings">Standings</button>
      <button data-view="teams">Teams</button>
      <button data-view="leaders">Leaders</button>
    </nav>
    <div class="mast-right">
      <div class="pulse-chip" id="pulse" aria-live="polite"><span class="dot" id="pulseDot"></span><span><strong id="liveCount">—</strong> <span class="txt-long" id="pulseTxt">connecting</span></span></div>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle light and dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <!-- SCORES -->
  <section class="view" id="v-scores" aria-label="Scores">
    <div class="rail-row">
      <button class="icon-btn rail-btn" data-rail="-1" aria-label="Earlier dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="hs-wrap"><div class="hs rail drag-x" id="rail" data-drag></div></div>
      <button class="icon-btn rail-btn" data-rail="1" aria-label="Later dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="scores-grid">
      <div style="min-width:0">
        <div class="day-head">
          <div>
            <div class="eyebrow" id="dayEyebrow">NBA · Regular season</div>
            <h1 class="h-display" id="dayTitle">Tonight</h1>
          </div>
          <div class="counts" id="counts"></div>
        </div>
        <div class="games" id="games"></div>
        <div class="perf-block" id="perfBlock" hidden>
          <div class="sec-h"><h2 id="perfTitle">Top scorers</h2><span class="eyebrow">Drag to browse</span></div>
          <div class="hs-wrap"><div class="hs perf drag-x" id="perf" data-drag></div></div>
        </div>
      </div>
      <aside class="side" id="side">
        <div class="panel">

      <div class="seg" id="stdSeg"><span class="knob"></span><button data-sconf="0" aria-pressed="true">Eastern</button><button data-sconf="1" aria-pressed="false">Western</button><button data-sconf="2" aria-pressed="false">League</button></div>

  <!-- TEAMS -->

  <!-- LEADERS -->
  <section class="view" id="v-leaders" aria-label="Leaders">
    <div class="eyebrow">Per game · qualified players</div>
    <h1 class="h-display page-title">League leaders</h1>

    <div id="leadBody"></div>

</main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button data-view="scores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14M3 12h4M17 12h4"/></svg>Scores</button>
  <button data-view="standings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>Standings</button>
  <button data-view="teams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/></svg>Teams</button>
  <button data-view="leaders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>Leaders</button>
</nav>

<div class="scrim" id="scrim"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ================= config ================= */
const API = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const API2 = 'https://site.api.espn.com/apis/v2/sports/basketball/nba';
const WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';
const CDN = (path, w, h) => `https://a.espncdn.com/combiner/i?img=${path}&w=${w}&h=${h}&scale=crop&cquality=80`;

const TEAM_COLORS = { ATL:'c8102e', BOS:'008348', BKN:'1a1a1a', CHA:'008ca8', CHI:'ce1141', CLE:'860038', DAL:'0064b1', DEN:'0e2240', DET:'1d428a', GS:'1d428a', HOU:'ce1141', IND:'002d62', LAC:'c8102e', LAL:'552583', MEM:'5d76a9', MIA:'98002e', MIL:'00471b', MIN:'266092', NO:'0c2340', NY:'1d428a', OKC:'007ac1', ORL:'0077c0', PHI:'1d428a', PHX:'1d1160', POR:'e03a3e', SAC:'5a2d81', SA:'2a2a2a', TOR:'ce1141', UTAH:'4e2a84', WSH:'e31837' };

const LEADER_CATS = [
  { k: 'Points', u: 'PPG', cat: 'offensive', name: 'avgPoints' },
  { k: 'Rebounds', u: 'RPG', cat: 'general', name: 'avgRebounds' },
  { k: 'Assists', u: 'APG', cat: 'offensive', name: 'avgAssists' },
  { k: 'Steals', u: 'SPG', cat: 'defensive', name: 'avgSteals' },
  { k: 'Blocks', u: 'BPG', cat: 'defensive', name: 'avgBlocks' },
  { k: '3-pointers', u: '3PM', cat: 'offensive', name: 'avgThreePointFieldGoalsMade' },
  { k: 'FG%', u: 'FG%', cat: 'offensive', name: 'fieldGoalPct', pct: true },
  { k: '3P%', u: '3P%', cat: 'offensive', name: 'threePointFieldGoalPct', pct: true },
  { k: 'FT%', u: 'FT%', cat: 'offensive', name: 'freeThrowPct', pct: true },
  { k: 'Minutes', u: 'MPG', cat: 'general', name: 'avgMinutes' },
  { k: 'Double-doubles', u: 'DD2', cat: 'general', name: 'doubleDouble', total: true },
];

/* ================= state ================= */
const S = {
  view: 'scores',
  today: null,          // YYYYMMDD (ESPN league day)
  date: null,           // selected YYYYMMDD
  games: [],
  prev: {},             // id -> "away-home"
  teams: {},            // id -> meta
  standings: null,
  miniConf: 0, stdConf: 0,
  leadKey: 0, leadCache: {},
  lastUpdate: 0, pollTimer: null, failures: 0,
  players: {},
};

/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function getJSON(url, { timeout = 12000, retries = 1 } = {}) {
  for (let a = 0; a <= retries; a++) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      clearTimeout(t);
      if (a === retries) throw e;
      await sleep(600 * (a + 1));
    }
  }
}

const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
};
const logoSrc = (abbr, size = 80, dark = isDark()) =>
  CDN(`/i/teamlogos/nba/${dark ? '500-dark/scoreboard' : '500'}/${String(abbr || '').toLowerCase()}.png`, size, size);
const logo = (abbr, size = 80, cls = 'lg') =>
  `<img class="${cls}" data-ab="${esc(abbr)}" data-s="${size}" src="${logoSrc(abbr, size)}" alt="" loading="lazy" draggable="false" onerror="this.onerror=null;this.src='${logoSrc(abbr, size, false)}'">`;
const headSrc = (id, w = 350) => CDN(`/i/headshots/nba/players/full/${id}.png`, w, Math.round(w * 254 / 350));
const initials = n => String(n || '').split(/\s+/).map(x => x[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
const face = (id, name, cls = 'face', w = 160) => id
  ? `<img class="${cls}" src="${headSrc(id, w)}" alt="${esc(name)}" loading="lazy" draggable="false" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls} avatar',textContent:'${esc(initials(name))}'}))">`
  : `<div class="${cls} avatar">${esc(initials(name))}</div>`;

const teamColor = (idOrAbbr) => {
  const t = S.teams[idOrAbbr] || Object.values(S.teams).find(x => x.abbr === idOrAbbr);
  const hex = t?.color || TEAM_COLORS[t?.abbr || idOrAbbr] || '444444';
  return '#' + hex;
};
function regTeam(t, extra = {}) {
  if (!t?.id) return;
  const cur = S.teams[t.id] || {};
  S.teams[t.id] = {
    ...cur,
    id: t.id,
    abbr: t.abbreviation || cur.abbr,
    name: t.displayName || cur.name,
    short: t.shortDisplayName || t.name || cur.short,
    loc: t.location || cur.loc,
    color: t.color || cur.color || TEAM_COLORS[t.abbreviation],
    ...extra,
  };
}

const ymd = d => `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}`;
const fromYmd = s => new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), 12));
const addDays = (s, n) => { const d = fromYmd(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); };
const fmtDay = (s, opts) => fromYmd(s).toLocaleDateString('en-US', { timeZone: 'UTC', ...opts }); // s is already an ET calendar date
/* Everything runs on New York time: the NBA's own calendar, and Anthony's (New Jersey). */
const TZ = 'America/New_York';
const ROLLOVER_HOUR = 4; // before 4 AM ET, "today" is still last night's slate so late West Coast games stay put
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }) + ' ET';
const fmtShortDate = iso => new Date(iso).toLocaleDateString('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
const fmtET = (iso, opts) => new Date(iso).toLocaleString('en-US', { timeZone: TZ, ...opts });
function etNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { ymd: `${p.year}${p.month}${p.day}`, hour: +p.hour };
}
const etToday = () => { const n = etNow(); return n.hour < ROLLOVER_HOUR ? addDays(n.ymd, -1) : n.ymd; };

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ================= drag-to-scroll with momentum ================= */
function dragScroll(el) {
  if (el._drag) return; el._drag = true;
  let down = false, sx = 0, sl = 0, moved = false, lastX = 0, lastT = 0, v = 0, raf = 0;
  const wrap = el.closest('.hs-wrap');
  const fades = () => {
    if (!wrap) return;
    const max = el.scrollWidth - el.clientWidth;
    wrap.style.setProperty('--fl', el.scrollLeft > 4 ? 1 : 0);
    wrap.style.setProperty('--fr', el.scrollLeft < max - 4 ? 1 : 0);
  };
  el.addEventListener('scroll', fades, { passive: true });
  el.addEventListener('click', ev => { if (Date.now() - (el._sup || 0) < 250) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  new ResizeObserver(fades).observe(el);
  el.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    cancelAnimationFrame(raf);
    down = true; moved = false; sx = lastX = e.clientX; sl = el.scrollLeft; lastT = performance.now(); v = 0;
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (!moved && Math.abs(dx) > 5) { moved = true; el.classList.add('dragging'); }
    if (moved) {
      el.scrollLeft = sl - dx;
      const now = performance.now(), dt = now - lastT;
      if (dt > 0) v = (e.clientX - lastX) / dt;
      lastX = e.clientX; lastT = now;
    }
  });
  window.addEventListener('pointerup', () => {
    if (!down) return; down = false;
    if (!moved) return;
    el.classList.remove('dragging');
    el._sup = Date.now();
    if (reduced) return;
    let vel = v * 16;
    const step = () => {
      el.scrollLeft -= vel; vel *= 0.92;
      if (Math.abs(vel) > 0.4) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  });
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && el.scrollWidth > el.clientWidth && el.classList.contains('hs')) {
      const atStart = el.scrollLeft <= 0 && e.deltaY < 0;
      const atEnd = el.scrollLeft >= el.scrollWidth - el.clientWidth - 1 && e.deltaY > 0;
      if (!atStart && !atEnd && e.shiftKey) { el.scrollLeft += e.deltaY; e.preventDefault(); }
    }
  }, { passive: false });
  requestAnimationFrame(fades);
}
const wireDrag = (root = document) => $$('[data-drag]', root).forEach(dragScroll);

/* ================= theme ================= */
function setTheme(next, origin) {
  const apply = () => {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('fc-theme', next); } catch (e) {}
    $$('img.lg').forEach(i => { i.onerror = null; i.src = logoSrc(i.dataset.ab, +i.dataset.s); i.onerror = () => { i.onerror = null; i.src = logoSrc(i.dataset.ab, +i.dataset.s, false); }; });
    $('meta[name="theme-color"]').content = next === 'dark' ? '#0C0E11' : '#ECEEEA';
  };
  if (!document.startViewTransition || reduced) return apply();
  const r = origin.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => {
    document.documentElement.animate(
      { clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
      { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)', pseudoElement: '::view-transition-new(root)' });
  }).catch(() => {});
}
$('#themeBtn').addEventListener('click', e => setTheme(isDark() ? 'light' : 'dark', e.currentTarget));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!document.documentElement.dataset.theme) $$('img.lg').forEach(i => i.src = logoSrc(i.dataset.ab, +i.dataset.s));
});

/* ================= segmented control knob ================= */
function placeKnob(seg) {
  const k = $('.knob', seg), b = $('[aria-pressed="true"]', seg);
  if (!k || !b) return;
  k.style.width = b.offsetWidth + 'px';
  k.style.transform = `translateX(${b.offsetLeft - 3}px)`;
  k.style.left = '3px';
}

/* ================= routing ================= */
const VIEWS = ['scores', 'standings', 'teams', 'leaders'];
function go(view, push = true) {
  if (!VIEWS.includes(view)) view = 'scores';
  S.view = view;
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  $$('#nav [data-view], #tabbar [data-view]').forEach(b => b.dataset.view === view ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  movePill();
  if (push && location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  if (view === 'standings') renderStandings();
  if (view === 'teams') renderTeams();
  if (view === 'leaders') loadLeaders();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function movePill() {
  const b = $(`#nav [data-view="${S.view}"]`), p = $('#navPill');
  if (!b || !p) return;
  p.style.width = b.offsetWidth + 'px';
  p.style.transform = `translateX(${b.offsetLeft}px)`;
}
window.addEventListener('hashchange', () => go(location.hash.slice(1), false));
window.addEventListener('resize', () => { movePill(); $$('.seg').forEach(placeKnob); });
document.fonts?.ready.then(() => { movePill(); $$('.seg').forEach(placeKnob); });

/* ================= scoreboard ================= */
function parseGame(e) {
  const c = e.competitions[0];
  const st = c.status || e.status;
  const t = st.type;
  const side = x => {
    regTeam(x.team);
    return {
      id: x.team.id, abbr: x.team.abbreviation, name: x.team.shortDisplayName || x.team.name, full: x.team.displayName,
      score: x.score, winner: x.winner,
      rec: (x.records || []).find(r => r.type === 'total' || r.name === 'overall')?.summary || '',
      leaders: x.leaders || [],
    };
  };
  const home = side(c.competitors.find(x => x.homeAway === 'home'));
  const away = side(c.competitors.find(x => x.homeAway === 'away'));
  return {
    id: e.id, date: e.date, state: t.state, detail: t.shortDetail, desc: t.description, name: t.name,
    period: st.period, clock: st.displayClock, completed: t.completed, home, away,
    venue: c.venue?.fullName, city: [c.venue?.address?.city, c.venue?.address?.state].filter(Boolean).join(', '),
    tv: [...new Set((c.broadcasts || []).flatMap(b => b.names || []))].join(' · '),
    note: c.notes?.[0]?.headline || '',
    headline: c.headlines?.[0]?.shortLinkText || '',
  };
}

function statusText(g) {
  if (g.state === 'pre') {
    if (/postponed|canceled|delayed/i.test(g.desc)) return g.desc;
    return fmtTime(g.date);
  }
  if (g.state === 'post') return g.period > 4 ? (g.period === 5 ? 'Final/OT' : `Final/${g.period - 4}OT`) : 'Final';
  if (/halftime/i.test(g.desc)) return 'Halftime';
  const per = g.period > 4 ? (g.period === 5 ? 'OT' : `${g.period - 4}OT`) : `Q${g.period}`;
  if (/end of/i.test(g.desc) || g.clock === '0.0') return `End ${per}`;
  return `${per} · ${g.clock}`;
}
function progress(g) {
  if (g.state !== 'in') return 0;
  const [m, s] = String(g.clock || '0:0').split(':').map(Number);
  const rem = (isNaN(s) ? (m || 0) / 60 : m + s / 60);
  const reg = Math.min(g.period, 4);
  const elapsed = (reg - 1) * 12 + (g.period <= 4 ? 12 - rem : 12);
  return Math.max(0, Math.min(1, elapsed / 48));
}
function untilText(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return 'Tip-off soon';
  const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  if (h >= 24) return '';
  return h ? `Tips in ${h}h ${m}m` : `Tips in ${m}m`;
}

let gamesFilter = 'all';
async function loadScores({ silent = false } = {}) {
  checkRollover();
  const url = `${API}/scoreboard?dates=${S.date}`;
  if (!silent) renderGamesSkeleton();
  try {
    const d = await getJSON(url);
    S.games = (d.events || []).map(parseGame);
    S.lastUpdate = Date.now(); S.failures = 0;
    renderGames(!silent);
    updatePulse();
  } catch (e) {
    S.failures++;
    if (!silent || !S.games.length) renderGamesError();
    updatePulse(true);
  }
  schedulePoll();
}
function schedulePoll() {
  clearTimeout(S.pollTimer);
  const live = S.games.some(g => g.state === 'in');
  const soon = S.games.some(g => g.state === 'pre' && new Date(g.date) - Date.now() < 30 * 60e3);
  const base = live ? 15000 : soon ? 30000 : 90000;
  const ms = Math.min(base * Math.pow(1.6, S.failures), 180000);
  S.pollTimer = setTimeout(() => {
    if (document.hidden) { schedulePoll(); return; }
    loadScores({ silent: true });
  }, ms);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (checkRollover() || Date.now() - S.lastUpdate > 15000) loadScores({ silent: true });
});
// When the NBA day turns over (4 AM ET), move "Today" forward. If you were looking at today, follow it.
function checkRollover() {
  const t = etToday();
  if (t === S.today) return false;
  const wasOnToday = !S.date || S.date === S.today;
  S.today = t;
  if (wasOnToday) { S.date = t; S.prev = {}; gamesFilter = 'all'; }
  buildRail();
  return true;
}
setInterval(() => { if (!document.hidden && checkRollover()) loadScores({ silent: true }); }, 60000);

function updatePulse(err) {
  const live = S.games.filter(g => g.state === 'in').length;
  $('#pulseDot').classList.toggle('on', live > 0 && !err);
  $('#liveCount').textContent = err ? 'Offline' : live ? `${live} live` : 'Live';
  tickPulse();
}
function tickPulse() {
  if (!S.lastUpdate) return;
  const s = Math.round((Date.now() - S.lastUpdate) / 1000);
  $('#pulseTxt').textContent = s < 5 ? '· updated just now' : s < 60 ? `· updated ${s}s ago` : `· updated ${Math.floor(s / 60)}m ago`;
}
setInterval(tickPulse, 1000);

function buildRail() {
  const rail = $('#rail');
  const out = [];
  for (let i = -21; i <= 21; i++) {
    const d = addDays(S.today, i);
    out.push(`<button class="day${d === S.today ? ' today' : ''}" data-date="${d}" aria-pressed="${d === S.date}">
      <span class="dw">${d === S.today ? 'Today' : esc(fmtDay(d, { weekday: 'short' }))}</span>
      <span class="dn">${fromYmd(d).getUTCDate()}</span>
      <span class="dm">${esc(fmtDay(d, { month: 'short' }))}</span></button>`);
  }
  rail.innerHTML = out.join('');
  dragScroll(rail);
  centerRail(false);
}
function centerRail(smooth = true) {
  const rail = $('#rail'), b = $(`[data-date="${S.date}"]`, rail);
  if (!b) return;
  rail.scrollTo({ left: b.offsetLeft - rail.clientWidth / 2 + b.offsetWidth / 2, behavior: smooth && !reduced ? 'smooth' : 'auto' });
}
function pickDate(d) {
  if (d === S.date) return;
  S.date = d; S.prev = {};
  $$('#rail .day').forEach(b => b.setAttribute('aria-pressed', b.dataset.date === d));
  centerRail();
  gamesFilter = 'all';
  loadScores();
}

function renderGamesSkeleton() {
  $('#games').innerHTML = Array.from({ length: 6 }, () => `<div class="sk" style="height:168px"></div>`).join('');
  $('#perfBlock').hidden = true;
}
function renderGamesError() {
  $('#games').innerHTML = `<div class="empty" style="grid-column:1/-1"><b>Can't reach the score feed</b>Check your connection. Fullcourt will keep retrying on its own.<br><button class="btn" data-retry="scores">Try again now</button></div>`;
}

function leaderLine(g) {
  const pick = side => {
    const cat = side.leaders.find(l => l.name === 'points' || l.name === 'pointsPerGame') || side.leaders[0];
    const L = cat?.leaders?.[0]; if (!L) return null;
    return { v: parseFloat(L.displayValue) || L.value || 0, dv: L.displayValue, a: L.athlete, team: side, cat };
  };
  const a = pick(g.away), h = pick(g.home);
  return [a, h].filter(Boolean).sort((x, y) => y.v - x.v)[0];
}

function gameCard(g, i, animate) {
  const live = g.state === 'in', post = g.state === 'post', pre = g.state === 'pre';
  const row = (s, other) => {
    const cls = post ? (s.winner ? 'win' : 'lose') : '';
    const key = `${g.id}-${s.id}`;
    const changed = S.prev[key] !== undefined && S.prev[key] !== s.score;
    return `<div class="trow ${cls}">
      ${logo(s.abbr, 68)}
      <div class="tname"><b>${esc(s.name)}</b><span>${esc(s.rec)}</span></div>
      ${pre ? '' : `<span class="score${changed ? ' bump' : ''}">${esc(s.score)}</span>`}
    </div>`;
  };
  const L = leaderLine(g);
  let foot = '';
  if (pre) {
    const until = untilText(g.date);
    foot = `<div class="g-foot"><span class="tip">${esc(fmtTime(g.date))}</span><span class="lead">${esc(until || g.venue || '')}</span></div>`;
  } else if (L) {
    foot = `<div class="g-foot">${face(L.a?.id, L.a?.displayName, 'mini-face', 80)}<span class="lead"><b>${esc(L.a?.shortName || L.a?.displayName)}</b> ${esc(L.dv)} ${L.cat?.name === 'points' ? 'pts' : esc(L.cat?.abbreviation || '')} · ${esc(L.team.abbr)}</span></div>`;
  }
  return `<button class="game${live ? ' live' : ''}${animate ? ' enter' : ''}" style="--i:${i}" data-game="${g.id}" aria-label="${esc(g.away.full)} at ${esc(g.home.full)}, ${esc(statusText(g))}">
    <div class="g-top">
      <span class="status${live ? ' live' : ''}">${live ? '<span class="dot on"></span>' : ''}${esc(pre ? fmtShortDate(g.date) : statusText(g))}</span>
      <span class="tv">${esc(g.note || g.tv)}</span>
    </div>
    ${row(g.away)}${row(g.home)}
    ${foot}
    ${live ? `<span class="prog" style="width:${(progress(g) * 100).toFixed(1)}%"></span>` : ''}
  </button>`;
}

function renderGames(animate) {
  const d = S.date;
  const rel = d === S.today ? 'Today' : d === addDays(S.today, -1) ? 'Yesterday' : d === addDays(S.today, 1) ? 'Tomorrow' : '';
  $('#dayTitle').textContent = rel || fmtDay(d, { weekday: 'long' });
  $('#dayEyebrow').textContent = fmtDay(d, { weekday: rel ? 'long' : undefined, month: 'long', day: 'numeric', year: 'numeric' });

  const live = S.games.filter(g => g.state === 'in'), pre = S.games.filter(g => g.state === 'pre'), post = S.games.filter(g => g.state === 'post');
  const cnt = [['all', `${S.games.length} games`], ['in', `${live.length} live`], ['post', `${post.length} final`], ['pre', `${pre.length} upcoming`]]
    .filter(([k], i) => i === 0 || (k === 'in' ? live.length : k === 'post' ? post.length : pre.length));
  $('#counts').innerHTML = S.games.length ? cnt.map(([k, t]) => `<button class="count${gamesFilter === k ? ' filter-on' : ''}" data-filter="${k}">${k === 'in' ? '<span class="dot on"></span>' : ''}${t}</button>`).join('') : '';

  let list = [...live, ...pre, ...post];
  if (gamesFilter !== 'all') list = list.filter(g => g.state === gamesFilter);
  if (!S.games.length) {
    $('#games').innerHTML = `<div class="empty" style="grid-column:1/-1"><b>No games on this date</b>Pick another day on the rail above.</div>`;
  } else {
    $('#games').innerHTML = list.map((g, i) => gameCard(g, i, animate)).join('');
  }
  S.games.forEach(g => { S.prev[`${g.id}-${g.home.id}`] = g.home.score; S.prev[`${g.id}-${g.away.id}`] = g.away.score; });
  renderPerformers(animate);
}

function renderPerformers(animate) {
  const items = [];
  const anyPlayed = S.games.some(g => g.state !== 'pre');
  for (const g of S.games) {
    if (anyPlayed && g.state === 'pre') continue;
    for (const side of [g.away, g.home]) {
      const cat = side.leaders.find(l => l.name === 'points' || l.name === 'pointsPerGame');
      const L = cat?.leaders?.[0];
      if (!L?.athlete) continue;
      const opp = side === g.away ? g.home : g.away;
      items.push({ v: parseFloat(L.displayValue) || 0, dv: L.displayValue, a: L.athlete, side, opp, g });
      const reb = side.leaders.find(l => /rebound/i.test(l.name))?.leaders?.[0];
      const ast = side.leaders.find(l => /assist/i.test(l.name))?.leaders?.[0];
      items.at(-1).extra = [reb?.athlete?.id === L.athlete.id ? `${reb.displayValue} reb` : '', ast?.athlete?.id === L.athlete.id ? `${ast.displayValue} ast` : ''].filter(Boolean).join(' · ');
    }
  }
  items.sort((a, b) => b.v - a.v);
  const blk = $('#perfBlock');
  if (!items.length) { blk.hidden = true; return; }
  blk.hidden = false;
  $('#perfTitle').textContent = anyPlayed ? 'Top scorers' : 'Players to watch';
  $('#perf').innerHTML = items.map((p, i) => {
    rememberPlayer(p.a, p.side.id);
    return `<button class="pcard${animate ? ' enter' : ''}" style="--i:${i};--tc:${teamColor(p.side.id)}" data-player="${p.a.id}">
      <div class="ph">${face(p.a.id, p.a.displayName, 'face', 350)}${logo(p.side.abbr, 44)}<span class="pv">${esc(p.dv)}<small>${anyPlayed ? 'PTS' : 'PPG'}</small></span></div>
      <div class="pi"><b>${esc(p.a.displayName)}</b><span>${esc(p.side.abbr)} ${p.side === p.g.home ? 'vs' : '@'} ${esc(p.opp.abbr)}${p.extra ? ' · ' + esc(p.extra) : ''}</span></div>
    </button>`;
  }).join('');
  dragScroll($('#perf'));
}

function rememberPlayer(a, teamId, extra = {}) {
  if (!a?.id) return;
  S.players[a.id] = { ...(S.players[a.id] || {}), id: a.id, name: a.displayName || a.fullName, short: a.shortName, jersey: a.jersey, pos: a.position?.abbreviation, teamId: teamId || a.team?.id || S.players[a.id]?.teamId, ...extra };
}

let stdPromise = null;
function loadStandings(force) {
  if (stdPromise && !force) return stdPromise;
  stdPromise = getJSON(`${API2}/standings`).then(d => {
    const confs = (d.children || []).map(ch => ({
      name: ch.name, short: /east/i.test(ch.name) ? 'East' : 'West',
      rows: (ch.standings?.entries || []).map(en => {
        const stat = n => en.stats.find(x => x.name === n) || en.stats.find(x => x.type === n);
        const dv = n => stat(n)?.displayValue ?? '–';
        const t = en.team;
        regTeam(t, { conf: /east/i.test(ch.name) ? 0 : 1 });
        return {
          id: t.id, abbr: t.abbreviation, name: t.displayName, short: t.shortDisplayName || t.name, loc: t.location,
          w: stat('wins')?.value ?? 0, l: stat('losses')?.value ?? 0, pct: dv('winPercent'), gb: dv('gamesBehind'),
          seed: stat('playoffSeed')?.value ?? 99, strk: dv('streak'), home: dv('home'), road: dv('road'),
          l10: dv('lasttengames'), ppg: dv('avgPointsFor'), opp: dv('avgPointsAgainst'),
          diff: stat('differential')?.value ?? 0, diffD: dv('differential'), conf: /east/i.test(ch.name) ? 0 : 1,
        };
      }).sort((a, b) => a.seed - b.seed),
    }));
    confs.sort((a, b) => (a.short === 'East' ? -1 : 1));
    S.standings = { confs, season: d.seasons?.find(s => s.year === d.season?.year)?.displayName || d.season?.displayName || '' };
    renderMini();
    if (S.view === 'standings') renderStandings();
    if (S.view === 'teams') renderTeams();
    return S.standings;
  }).catch(e => { stdPromise = null; throw e; });
  return stdPromise;
}
setInterval(() => { if (!document.hidden) loadStandings(true).catch(() => {}); }, 5 * 60e3);

function renderStandings() {
  const wrap = $('#stdWrap');
  if (!S.standings) {
    wrap.innerHTML = `<div style="padding:14px;display:grid;gap:8px">${Array.from({ length: 10 }, () => '<div class="sk" style="height:34px;border-radius:8px"></div>').join('')}</div>`;
    loadStandings().catch(() => { wrap.innerHTML = `<div class="empty" style="border:0"><b>Standings didn't load</b>The feed may be busy.<br><button class="btn" data-retry="standings">Try again</button></div>`; });
    return;
  }
  $('#stdSeason').textContent = `${S.standings.season || 'Current'} season`;
  let rows, league = S.stdConf === 2;
  if (league) {
    rows = S.standings.confs.flatMap(c => c.rows).sort((a, b) => (parseFloat(b.pct) || 0) - (parseFloat(a.pct) || 0) || b.w - a.w);
  } else rows = S.standings.confs[S.stdConf]?.rows || [];
  const maxDiff = Math.max(1, ...rows.map(r => Math.abs(r.diff)));
  wrap.innerHTML = `<table class="std">
    <thead><tr><th>${league ? '#' : 'Seed'} · Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>Home</th><th>Away</th><th>L10</th><th>Strk</th><th>PPG</th><th>OPP</th><th>Diff</th></tr></thead>
    <tbody>${rows.map((r, i) => {
      const seed = league ? i + 1 : r.seed;
      const zone = league ? '' : seed <= 6 ? 'po' : seed <= 10 ? 'pi' : '';
      const cut = league ? '' : seed === 6 ? 'cut' : seed === 10 ? 'cut-pi' : '';
      const sw = /^W/.test(r.strk) ? 'strk-w' : /^L/.test(r.strk) ? 'strk-l' : '';
      const w = Math.round(Math.abs(r.diff) / maxDiff * 54);
      return `<tr class="${cut}" data-team="${r.id}" style="--i:${i}">
        <td><div class="team-cell"><i class="zone ${zone}"></i><span class="seed">${seed}</span>${logo(r.abbr, 56)}<b>${esc(r.name)}</b><span class="ab">${esc(r.abbr)}</span>${league ? `<span class="eyebrow">${r.conf ? 'W' : 'E'}</span>` : ''}</div></td>
        <td>${r.w}</td><td>${r.l}</td><td>${esc(r.pct)}</td><td>${esc(r.gb)}</td><td>${esc(r.home)}</td><td>${esc(r.road)}</td><td>${esc(r.l10)}</td>
        <td class="${sw}">${esc(r.strk)}</td><td>${esc(r.ppg)}</td><td>${esc(r.opp)}</td>
        <td><span class="diffbar"><i data-w="${w}" style="background:${r.diff >= 0 ? 'var(--win)' : 'var(--loss)'}"></i><span class="${r.diff >= 0 ? 'strk-w' : 'strk-l'}">${r.diff > 0 ? '+' : ''}${esc(r.diffD)}</span></span></td>
      </tr>`;
    }).join('')}</tbody></table>`;
  dragScroll(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => $$('.diffbar i', wrap).forEach(i => i.style.width = i.dataset.w + 'px')));
}
